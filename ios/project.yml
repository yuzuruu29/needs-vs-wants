name: NeedsVsWants
options:
  bundleIdPrefix: com.needsvswants
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: Needs vs Wants
    PRODUCT_BUNDLE_IDENTIFIER: com.needsvswants.ios
    INFOPLIST_FILE: NeedsVsWants/Info.plist
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    DEVELOPMENT_TEAM: ""            # set your Apple Developer Team ID before archiving
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_PREVIEWS: "YES"

targets:
  NeedsVsWants:
    type: application
    platform: iOS
    sources:
      - path: NeedsVsWants
    settings:
      base:
        INFOPLIST_FILE: NeedsVsWants/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.needsvswants.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
