name: NeedsVsWants
options:
  bundleIdPrefix: com.needsvswants
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NeedsVsWants:
    type: application
    platform: iOS
    sources:
      - path: NeedsVsWants
        excludes:
          - "Info.plist"
    resources:
      - NeedsVsWants/Resources/PlayfairDisplaySC-Bold.ttf
      - NeedsVsWants/Resources/PlayfairDisplaySC-Regular.ttf
    info:
      path: NeedsVsWants/Info.plist
      properties:
        CFBundleDisplayName: Needs vs. Wants
        UILaunchScreen: {}
        UIAppFonts:
          - PlayfairDisplaySC-Bold.ttf
          - PlayfairDisplaySC-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.needsvswants.ios
        ENABLE_PREVIEWS: "YES"
  NeedsVsWantsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NeedsVsWantsTests
    dependencies:
      - target: NeedsVsWants
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  NeedsVsWants:
    build:
      targets:
        NeedsVsWants: all
        NeedsVsWantsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeedsVsWantsTests
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
