        - generic [ref=e330]:
          - heading "An optional daily budget" [level=3] [ref=e331]
          - paragraph [ref=e332]: Set a limit on Log — the meter there (and Summary Day) shows today's spend, remaining budget, and when you're over. Logging would push you over? The diary asks before you seal — you still decide.
          - list [ref=e333]:
            - listitem [ref=e334]: Set it on Log. Open Log, enter your daily limit — say ₱1,500 — and Save budget.
            - listitem [ref=e335]: Watch the meter. On Log and Summary Day, see spent vs budget and what's left. Green keeps you on track; red tells you you're over.
            - listitem [ref=e336]: Seal past the line? The diary asks “Log anyway?” first. Cancel keeps your draft; Log seals it — your call, every time.
            - listitem [ref=e337]: Change or turn off anytime. On Log, tap Change to update the limit, or Turn off to drop the guardrail. The trainer stays.
