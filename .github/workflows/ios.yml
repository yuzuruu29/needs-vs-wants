name: iOS Build

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

env:
  PROJECT_DIR: ios
  SCHEME: NeedsVsWants
  DESTINATION: 'platform=iOS Simulator,name=iPhone 15,OS=latest'

jobs:
  build:
    name: Build & Test (Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Build for Simulator
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild clean build \
            -project NeedsVsWants.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination '${{ env.DESTINATION }}' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app for artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP_PATH=$(find DerivedData -name '*.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found"
            exit 1
          fi
          mkdir -p artifacts
          cp -R "$APP_PATH" artifacts/
          ls -la artifacts/

      - name: Upload Simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeedsVsWants-Simulator
          path: ios/artifacts/*.app
          retention-days: 30

