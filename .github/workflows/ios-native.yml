name: iOS Native

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-native/**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Boot an iOS 18.x simulator and wait for it
        id: sim
        run: |
          echo "=== Available simulators ==="
          xcrun simctl list devices available 2>&1 || true

          # Find an iPhone on an iOS 18.x runtime
          UDID=$(xcrun simctl list devices available -j 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for runtime, devices in data['devices'].items():
                  if 'iOS-18' not in runtime:
                      continue
                  for d in devices:
                      if 'iPhone' in d['name'] and d.get('isAvailable'):
                          udid = d.get('udid', d.get('id', ''))
                          if udid:
                              print(udid); sys.exit(0)
          except Exception:
              pass
          print('NONE')
          " 2>/dev/null || echo "NONE")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Found iOS 18.x iPhone UDID: $UDID"

          if [ "$UDID" = "NONE" ] || [ -z "$UDID" ]; then
            echo "::error::No iPhone on iOS 18.x found."
            exit 1
          fi

          # Erase (clean state), boot, and WAIT for full boot before xcodebuild.
          echo "Erasing simulator..."
          xcrun simctl erase "$UDID" 2>/dev/null || true
          echo "Booting simulator..."
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "Waiting for boot to complete..."
          xcrun simctl bootstatus "$UDID" -b 2>/dev/null || true
          echo "Boot complete. State:"
          xcrun simctl list devices | grep "$UDID" || true

      - name: Build & Test
        working-directory: ios-native
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail

          # Use name-based destination as fallback if UDID doesn't resolve.
          # First try UDID; if xcodebuild can't resolve it, try name-based.
          echo "=== Attempt 1: UDID-based destination ==="
          xcodebuild \
            -project NeedsVsWants.xcodeproj \
            -scheme NeedsVsWants \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -configuration Debug \
            -destination-timeout 120 \
            build test 2>&1 | tee build.log || {

            echo "=== UDID failed. Attempt 2: name-based destination ==="
            # List what xcodebuild CAN see
            xcodebuild \
              -project NeedsVsWants.xcodeproj \
              -scheme NeedsVsWants \
              -showdestinations 2>&1 || true

            # Try generic iPhone simulator destination
            xcodebuild \
              -project NeedsVsWants.xcodeproj \
              -scheme NeedsVsWants \
              -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
              -derivedDataPath build \
              -configuration Debug \
              -destination-timeout 120 \
              build test 2>&1 | tee build.log
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-build-logs
          path: |
            ios-native/build.log
            ios-native/build
