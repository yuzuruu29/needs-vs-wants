name: iOS Native

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-native/**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Discover an available iPhone simulator
        id: sim
        run: |
          echo "Available devices:"
          xcrun simctl list devices available 2>&1 || true
          UDID=$(xcrun simctl list devices available -j 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for runtime, devices in data['devices'].items():
                  for d in devices:
                      if 'iPhone' in d['name'] and d.get('isAvailable'):
                          udid = d.get('udid', d.get('id', ''))
                          if udid:
                              print(udid); sys.exit(0)
          except Exception as e:
              print(f'ERR: {e}', file=sys.stderr)
          print('NONE')
          " 2>/dev/null || echo "NONE")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Found simulator UDID: $UDID"

      - name: Build & Test
        working-directory: ios-native
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          if [ "$SIM_UDID" = "NONE" ] || [ -z "$SIM_UDID" ]; then
            echo "::error::No iPhone simulator found — cannot build or test."
            exit 1
          fi
          echo "Booting simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 5

          xcodebuild \
            -project NeedsVsWants.xcodeproj \
            -scheme NeedsVsWants \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -configuration Debug \
            build test 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-build-logs
          path: |
            ios-native/build.log
            ios-native/build
