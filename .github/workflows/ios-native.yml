name: iOS Native

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-native/**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build (generic simulator — compile check)
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild \
            -project NeedsVsWants.xcodeproj \
            -scheme NeedsVsWants \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -configuration Debug \
            build 2>&1 | tee build.log

      - name: Test (if a booted simulator is available)
        working-directory: ios-native
        run: |
          set -o pipefail
          # Find the first available iPhone simulator; fall back to any simulator.
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['id']); sys.exit(0)
          print('NONE')
          ")
          if [ "$DEST" = "NONE" ]; then
            echo "::warning::No iPhone simulator available — skipping tests (build only)."
            exit 0
          fi
          echo "Using simulator: $DEST"
          xcrun simctl boot "$DEST" 2>/dev/null || true
          xcodebuild \
            -project NeedsVsWants.xcodeproj \
            -scheme NeedsVsWants \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath build \
            -configuration Debug \
            test 2>&1 | tee test.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-build-logs
          path: |
            ios-native/build.log
            ios-native/test.log
            ios-native/build
