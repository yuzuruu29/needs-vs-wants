name: Android Build

# Flavor dimensions:
# distribution (direct = sideload APK + PayPal/PayMongo, play = Google Play AAB + Play Billing)
# experience (full = production app, plain = free test build)

on:
  push:
    branches: [main, master, feat/**]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  test-and-assemble:
    name: Unit tests + lint + assemble debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Direct & Play)
        run: ./gradlew :app:testDirectFullDebugUnitTest :app:testPlayFullDebugUnitTest --stacktrace

      - name: Lint (Direct & Play)
        run: ./gradlew :app:lintDirectFullDebug :app:lintPlayFullDebug --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDirectFullDebug :app:assemblePlayFullDebug --stacktrace

  release-build:
    name: Signed Release APK (Direct) & Signed Release AAB (Google Play)
    runs-on: ubuntu-latest
    needs: test-and-assemble
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
      # Runtime BuildConfig values for the release artifacts. CI has no
      # local.properties; localProp() in app/build.gradle.kts falls back to these
      # env vars. Guarded so an unset secret yields '' instead of a broken
      # literal — blank SUPABASE_*/GOOGLE_WEB_CLIENT_ID then hard-fails the
      # build's config gate instead of shipping a signed-but-dead artifact.
      # TEST AdMob ids / blank SENTRY_DSN stay the deliberate soft-launch
      # posture (D159-D161): warned, never failed. The debug/PR job above needs
      # none of these.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_URL || '' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_ANON_KEY || '' }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID != '' && secrets.GOOGLE_WEB_CLIENT_ID || '' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' && secrets.SENTRY_DSN || '' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID != '' && secrets.ADMOB_APP_ID || '' }}
      ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID != '' && secrets.ADMOB_REWARDED_UNIT_ID || '' }}

    steps:
      - name: Signing secrets absent — skipping
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: echo 'RELEASE_* signing secrets are not configured for this repo; skipping the signed release build.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble Direct Full Release (signed APK)
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDirectFullRelease --stacktrace

      - name: Bundle Google Play Full Release (signed AAB)
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayFullRelease --stacktrace

      - name: Checksums
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          sha256sum app/build/outputs/apk/directFull/release/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/outputs/bundle/playFullRelease/*.aab | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Direct Release APK
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-direct-full-release
          path: app/build/outputs/apk/directFull/release/*.apk
          retention-days: 30

      - name: Upload Google Play Release AAB
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-play-full-release
          path: app/build/outputs/bundle/playFullRelease/*.aab
          retention-days: 30
