name: Android Instrumented Tests

# Money-path instrumented tests (paywall/deep-link/backup smoke) on a
# Gradle-managed emulator. Nightly + manual — emulator jobs are slow and
# these don't need to gate every push.
on:
  schedule:
    - cron: "30 18 * * *" # 02:30 PH time, daily
  workflow_dispatch:

jobs:
  instrumented:
    name: Managed-device androidTest (full flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests (Gradle managed device)
        run: ./gradlew :app:pixel2api33FullDebugAndroidTest --stacktrace

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-results
          path: app/build/outputs/androidTest-results/
